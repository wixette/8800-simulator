name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          # No cache: the simulator has no dependencies and no lockfile,
          # so there is nothing to install and nothing to restore. For
          # the same reason there is no "npm ci" step below.
      - run: npm test
