name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every version, so one failure does not hide the others.
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # No cache: the simulator has no dependencies and no lockfile,
          # so there is nothing to install and nothing to restore. For
          # the same reason there is no "npm ci" step below.
      - run: npm test
